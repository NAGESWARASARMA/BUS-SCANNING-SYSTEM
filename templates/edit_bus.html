<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Bus Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }

        .card {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 14px #0000000d;
        }

        h1 {
            color: #173b70;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button, .back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .back {
            background: #e5e7eb;
            color: #111827;
            margin-left: 8px;
        }

        .message {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 7px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="card">

    <h1>✏️ Edit Bus Details</h1>
    <p>Change the required information and click Update Bus.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="grid">

            <div>
                <label>Bus Number *</label>
                <input name="bus_number"
                       value="{{ bus['bus_number'] }}"
                       required>
            </div>

            <div>
                <label>Registration Number</label>
                <input name="registration_number"
                       value="{{ bus['registration_number'] or '' }}">
            </div>

            <div>
                <label>Driver Name *</label>
                <input name="driver_name"
                       value="{{ bus['driver_name'] }}"
                       required>
            </div>

            <div>
                <label>Driver Phone</label>
                <input name="driver_phone"
                       type="tel"
                       value="{{ bus['driver_phone'] or '' }}">
            </div>

            <div>
                <label>Route *</label>
                <input name="route"
                       value="{{ bus['route'] }}"
                       required>
            </div>

            <div>
                <label>Starting Place</label>
                <input name="starting_place"
                       value="{{ bus['starting_place'] or '' }}">
            </div>

            <div>
                <label>Stops</label>
                <textarea name="stops" rows="3">{{ bus['stops'] or '' }}</textarea>
            </div>

            <div>
                <label>Scheduled Arrival</label>
                <input name="scheduled_arrival"
                       type="time"
                       value="{{ bus['scheduled_arrival'] or '' }}">
            </div>

            <div>
                <label>Scheduled Departure</label>
                <input name="scheduled_departure"
                       type="time"
                       value="{{ bus['scheduled_departure'] or '' }}">
            </div>

            <div>
                <label>Bus Capacity</label>
                <input name="capacity"
                       type="number"
                       min="0"
                       value="{{ bus['capacity'] or 0 }}">
            </div>

        </div>

        <button type="submit">💾 Update Bus</button>
        <a class="back" href="{{ url_for('home') }}">Cancel</a>
    </form>

</div>
</body>
</html>
